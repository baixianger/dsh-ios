name: DshApp
options:
  bundleIdPrefix: me.impai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  DshApp:
    type: application
    platform: iOS
    sources:
      - App
      - Sources/DshClient
    settings:
      base:
        DEVELOPMENT_TEAM: TN7ZDD72P2
        PRODUCT_BUNDLE_IDENTIFIER: me.impai.dsh
        CODE_SIGN_ENTITLEMENTS: App/DshApp.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: 用于语音输入
        NSCameraUsageDescription: 用于扫描 DSH 主机的一次性配对二维码
        NSSpeechRecognitionUsageDescription: 用于将语音转换为文字
        NSLocalNetworkUsageDescription: 用于连接用户选择的局域网 DSH 主机
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: 2026 ImPai
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: me.impai.dsh.pair
            CFBundleURLSchemes:
              - dsh
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  DshAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: DshApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DshApp:
    build:
      targets:
        DshApp: all
        DshAppTests: [test]
    test:
      targets:
        - DshAppTests
    run:
      config: Debug
