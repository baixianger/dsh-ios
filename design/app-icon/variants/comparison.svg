<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 2200 2400">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#060912"/>
      <stop offset=".52" stop-color="#0A1022"/>
      <stop offset="1" stop-color="#050711"/>
    </linearGradient>
    <radialGradient id="wash">
      <stop stop-color="#4D6BFE" stop-opacity=".18"/>
      <stop offset="1" stop-color="#4D6BFE" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="38" flood-color="#000000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="2200" height="2400" fill="url(#board)"/>
  <ellipse cx="1100" cy="280" rx="980" ry="620" fill="url(#wash)"/>
  <text x="140" y="155" fill="#F2F7FF" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="74" font-weight="700" letter-spacing="-2">DeepSeek Harness · iOS Icon Studies</text>
  <text x="140" y="226" fill="#8294B8" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="30" letter-spacing="2">OFFICIAL WHALE MARK · DEEPSEEK OCEAN BLUE · PHAROS MODULAR GLOW</text>

  <g transform="translate(140 330)">
    <image href="a-abyss-glow.png" xlink:href="a-abyss-glow.png" width="860" height="860" filter="url(#shadow)"/>
    <circle cx="54" cy="952" r="35" fill="#4D6BFE"/>
    <text x="54" y="964" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700">A</text>
    <text x="112" y="952" fill="#F1F6FF" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="700">ABYSS GLOW</text>
    <text x="112" y="1000" fill="#8294B8" font-family="Helvetica, Arial, sans-serif" font-size="29">Balanced · deep ocean · luminous pearl</text>
  </g>

  <g transform="translate(1200 330)">
    <image href="b-electric-inverse.png" xlink:href="b-electric-inverse.png" width="860" height="860" filter="url(#shadow)"/>
    <circle cx="54" cy="952" r="35" fill="#25CFFF"/>
    <text x="54" y="964" text-anchor="middle" fill="#031026" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700">B</text>
    <text x="112" y="952" fill="#F1F6FF" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="700">ELECTRIC INVERSE</text>
    <text x="112" y="1000" fill="#8294B8" font-family="Helvetica, Arial, sans-serif" font-size="29">Bold · dark mark · closest to Pharos</text>
  </g>

  <g transform="translate(140 1370)">
    <image href="c-aurora-pearl.png" xlink:href="c-aurora-pearl.png" width="860" height="860" filter="url(#shadow)"/>
    <circle cx="54" cy="952" r="35" fill="#7C65FF"/>
    <text x="54" y="964" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700">C</text>
    <text x="112" y="952" fill="#F1F6FF" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="700">AURORA PEARL</text>
    <text x="112" y="1000" fill="#8294B8" font-family="Helvetica, Arial, sans-serif" font-size="29">Bright · friendly · cyan-violet field</text>
  </g>

  <g transform="translate(1200 1370)">
    <image href="d-brand-core.png" xlink:href="d-brand-core.png" width="860" height="860" filter="url(#shadow)"/>
    <circle cx="54" cy="952" r="35" fill="#4D6BFE"/>
    <text x="54" y="964" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700">D</text>
    <text x="112" y="952" fill="#F1F6FF" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="700">BRAND CORE</text>
    <text x="112" y="1000" fill="#8294B8" font-family="Helvetica, Arial, sans-serif" font-size="29">Focused · official blue · product-ready</text>
  </g>
</svg>
