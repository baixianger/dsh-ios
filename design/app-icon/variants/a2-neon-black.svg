      <stop offset=".48" stop-color="#033682" stop-opacity=".045"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="frameFar" x="-20%" y="-20%" width="140%" height="140%">
