  <rect x="45" y="45" width="934" height="934" rx="203" fill="none"
        stroke="#BDF9FF" stroke-width="1.5" opacity=".3"/>

  <!-- Official DeepSeek whale path rendered as a hollow neon sign. -->
  <g transform="translate(195 202) scale(26.4)" stroke-linejoin="round" stroke-linecap="round">
    <use href="#deepseek-whale" fill="none" stroke="#065BFF" stroke-width=".9"
         opacity=".68" filter="url(#whaleFar)"/>
    <use href="#deepseek-whale" fill="none" stroke="#16D8FF" stroke-width=".46"
         opacity=".82" filter="url(#whaleNear)"/>
    <use href="#deepseek-whale" fill="#010205" stroke="url(#whaleTube)" stroke-width=".135"
         filter="url(#whaleCore)"/>
  </g>
