    <linearGradient id="frameTube" x1="90" y1="70" x2="940" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9FDFF"/>
      <stop offset=".22" stop-color="#55E7FF"/>
      <stop offset=".52" stop-color="#278AFF"/>
      <stop offset=".78" stop-color="#4D6BFE"/>
      <stop offset="1" stop-color="#9CF5FF"/>
    </linearGradient>
    <linearGradient id="whaleTube" x1="3" y1="3" x2="22" y2="21" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E9FFFF"/>
      <stop offset=".25" stop-color="#75F0FF"/>
      <stop offset=".58" stop-color="#25B8FF"/>
      <stop offset="1" stop-color="#4D6BFE"/>
    </linearGradient>
    <radialGradient id="centerHaze">
