    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#010205"/>
  <ellipse cx="512" cy="510" rx="405" ry="348" fill="url(#centerHaze)"/>

  <!-- Outer neon tube: atmospheric halo, colored bloom, then crisp glass core. -->
  <rect x="34" y="34" width="956" height="956" rx="214" fill="none"
        stroke="#075BFF" stroke-width="24" opacity=".56" filter="url(#frameFar)"/>
  <rect x="34" y="34" width="956" height="956" rx="214" fill="none"
