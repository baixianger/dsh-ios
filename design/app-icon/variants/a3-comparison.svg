<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 2200 1320">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070A12"/>
      <stop offset=".52" stop-color="#10172C"/>
      <stop offset="1" stop-color="#05070D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="38" flood-color="#000000" flood-opacity=".62"/>
    </filter>
  </defs>
  <rect width="2200" height="1320" fill="url(#board)"/>
  <text x="140" y="142" fill="#F4F8FF" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="72" font-weight="700">A → A3 · Modular Frosted Glass</text>
  <text x="140" y="210" fill="#8395B9" font-family="Helvetica, Arial, sans-serif" font-size="30" letter-spacing="2">ORIGINAL FILLED WHALE · SEAMLESS GLASS BRICKS · SOFT LIGHT SCATTERING</text>

  <g transform="translate(140 290)">
    <image href="a-abyss-glow.png" xlink:href="a-abyss-glow.png" width="860" height="860" filter="url(#shadow)"/>
    <text x="0" y="950" fill="#F1F6FF" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="700">A · ABYSS GLOW</text>
    <text x="0" y="1000" fill="#8395B9" font-family="Helvetica, Arial, sans-serif" font-size="29">Original · clean fluorescent material</text>
  </g>

  <g transform="translate(1200 290)">
    <image href="a3-modular-frost.png" xlink:href="a3-modular-frost.png" width="860" height="860" filter="url(#shadow)"/>
    <text x="0" y="950" fill="#F1F6FF" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="700">A3 · MODULAR FROST</text>
    <text x="0" y="1000" fill="#8395B9" font-family="Helvetica, Arial, sans-serif" font-size="29">Filled whale · sampled glass tiles · softened field</text>
  </g>
</svg>
