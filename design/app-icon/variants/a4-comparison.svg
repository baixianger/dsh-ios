<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 2200 1320">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070910"/>
      <stop offset=".54" stop-color="#11172A"/>
      <stop offset="1" stop-color="#04060B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="38" flood-color="#000000" flood-opacity=".65"/>
    </filter>
  </defs>
  <rect width="2200" height="1320" fill="url(#board)"/>
  <text x="140" y="142" fill="#F4F8FF" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="72" font-weight="700">A3 → A4 · True Frosted Slab</text>
  <text x="140" y="210" fill="#8395B9" font-family="Helvetica, Arial, sans-serif" font-size="30" letter-spacing="2">NO TILE MASK · TRUE UNDERLAY REFRACTION · PHAROS INWARD EDGE LIGHT</text>

  <g transform="translate(140 290)">
    <image href="a3-modular-frost.png" xlink:href="a3-modular-frost.png" width="860" height="860"/>
    <text x="0" y="950" fill="#F1F6FF" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="700">A3 · TILE OVERLAY</text>
    <text x="0" y="1000" fill="#8395B9" font-family="Helvetica, Arial, sans-serif" font-size="29">Color grid · artificial pane boundaries</text>
  </g>

  <g transform="translate(1200 290)">
    <image href="a4-frosted-slab.png" xlink:href="a4-frosted-slab.png" width="860" height="860"/>
    <text x="0" y="950" fill="#F1F6FF" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="700">A4 · FROSTED SLAB</text>
    <text x="0" y="1000" fill="#8395B9" font-family="Helvetica, Arial, sans-serif" font-size="29">Black field · clean whale · thick inward fluorescence</text>
  </g>
</svg>
