    <!-- A translucent modular glass-brick cover inspired by the supplied Orma reference. -->
    <rect x="20" y="20" width="984" height="984" fill="#D9F9FF" opacity=".045"/>
    <rect x="20" y="20" width="984" height="984" fill="url(#glassMosaic)"
          mask="url(#glassFade)" opacity=".82" style="mix-blend-mode:screen"/>
    <rect x="20" y="20" width="984" height="984" fill="url(#glassMosaic)"
          mask="url(#glassFade)" opacity=".28" filter="url(#glassBloom)" style="mix-blend-mode:screen"/>

    <rect x="24" y="24" width="976" height="976" rx="216" fill="none" stroke="url(#edgeLight)" stroke-width="8"/>
    <rect x="39" y="39" width="946" height="946" rx="204" fill="none" stroke="#BCEFFF" stroke-opacity=".13" stroke-width="3"/>
  </g>
</svg>
