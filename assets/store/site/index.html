p{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:translateY(18px) scale(.985);pointer-events:none;transition:opacity .42s ease,transform .42s ease}.mockup.active{opacity:1;transform:none;pointer-events:auto}.device{position:relative;filter:drop-shadow(0 30px 34px rgba(29,29,36,.22))}.iphone{width:min(310px,76vw);aspect-ratio:450/920}.ipad{width:min(780px,96vw);aspect-ratio:2952/2264}.screen{position:absolute;overflow:hidden;background:#fff}.iphone .screen{top:3%;left:5.4%;width:89.2%;height:94%;border-radius:32px}.ipad .screen{top:4.42%;left:3.39%;width:93.22%;height:91.17%;border-radius:19px}.screen img{display:block;width:100%;height:100%;object-fit:fill}.frame{position:absolute;z-index:2;inset:0;width:100%;height:100%;pointer-events:none}.slide-label{display:flex;gap:7px;margin:16px 0 3px}.slide-label button{width:7px;height:7px;padding:0;border:0;border-radius:50%;background:#b9b9c0;cursor:pointer}.slide-label button.active{background:#303036;transform:scale(1.2)}.store-fab{position:fixed;right:22px;bottom:22px;z-index:9;display:flex;align-items:center;gap:10px;padding:10px 15px 10px 11px;border-radius:17px;background:#111114;color:#fff;text-decoration:none;box-shadow:0 10px 28px rgba(15,15,18,.28);transition:transform .2s ease,box-shadow .2s ease}.store-fab:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(15,15,18,.34)}.store-fab svg{width:25px;height:25px;fill:currentColor}.store-fab small{display:block;font-size:9px;letter-spacing:.01em;opacity:.74}.store-fab strong{display:block;font-size:14px;line-height:1.1;letter-spacing:-.02em}.bottom{position:relative;z-index:2;max-width:1240px;margin:auto;padding:16px 32px 27px;display:flex;justify-content:space-between;color:#888891;font-size:13px}.bottom a{color:inherit;text-decoration:none;border-bottom:1px solid #b5b5bc}@media(max-width:700px){.top{padding:18px 20px}.hero{padding:31px 20px 0}.copy{width:100%}.copy h1{max-width:100%;font-size:clamp(42px,13vw,58px);overflow-   <script>
    const slides=['main.png','sidebar.png','session.png','setup-1.png','setup-2.png','setup-3.png'];let locale='en',device='iphone',index=0,timer;const dots=[...document.querySelectorAll('[data-slide]')];function show(){document.querySelectorAll('[data-device-view]').forEach(el=>el.classList.toggle('active',el.dataset.deviceView===device));document.querySelectorAll('[data-device]').forEach(el=>el.classList.toggle('active',el.dataset.device===device));document.querySelector(`[data-device-view="${device}"] .screen img`).src=`assets/${locale}/${device}/${slides[index]}`;dots.forEach((dot,i)=>dot.classList.toggle('active',i===index))}function next(){index=(index+1)%slides.length;show()}function play(){clearInterval(timer);timer=setInterval(next,4200)}document.querySelectorAll('[data-device]').forEach(button=>button.addEventListener('click',()=>{device=button.dataset.device;index=0;show();play()}));dots.forEach((dot,i)=>dot.addEventListener('click',()=>{index=i;show();play()}));document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>{locale=button.dataset.lang;document.documentElement.lang=locale==='zh'?'zh-Hans':'en';index=0;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b===button));document.querySelectorAll('[data-en]').forEach(el=>{const value=el.dataset[locale];if(el.tagName==='H1')el.innerHTML=value;else el.textContent=value});show();play()}));play();
  </script>
